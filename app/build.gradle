plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alamo.pdalauncher'
    compileSdk 35

    defaultConfig {
        applicationId "com.alamo.pdalauncher"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
